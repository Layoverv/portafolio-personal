<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de José Luis Oviedo Camacho, estudiante de Tecnología en Sistemas de Información." />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- De la fuente japonesa solo se descarga el glifo 炎 (llama) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&text=%E7%82%8E&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#070304" />
    <title>José Luis Oviedo | Portafolio</title>

    <!--
      Vista previa al compartir el enlace (WhatsApp, Discord, LinkedIn, X, Telegram...).
      %SITE_URL% lo reemplaza vite.config.js al compilar con la URL pública del sitio:
      las plataformas exigen direcciones absolutas (https://...) para la imagen.
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="José Luis Oviedo | Portafolio" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="José Luis Oviedo Camacho | Portafolio" />
    <meta property="og:description" content="Desarrollador de software en formación. Proyectos, conocimientos y un asistente con IA que responde sobre mi perfil." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portafolio de José Luis Oviedo Camacho: ilustración anime en tonos rojos con el texto FIRST TO THE KEY" />

    <!-- X (Twitter) usa sus propias etiquetas; summary_large_image = imagen grande -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="José Luis Oviedo Camacho | Portafolio" />
    <meta name="twitter:description" content="Desarrollador de software en formación. Proyectos, conocimientos y un asistente con IA." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Portafolio de José Luis Oviedo Camacho" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
